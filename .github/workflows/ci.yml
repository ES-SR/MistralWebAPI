name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency project: no npm install needed.
      - name: Syntax-check all JS/TS + boot server and probe routes
        run: npm run smoke
