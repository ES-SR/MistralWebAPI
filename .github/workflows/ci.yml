name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency project: no npm install needed.
      - name: Syntax-check all JS/TS + boot server and probe routes
        run: npm run smoke

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check all zsh files
        run: find @ tests -name '*.zsh' -print0; ls @webAPI _@webAPI install.zsh; find @ tests -name '*.zsh' -print0 | xargs -0 -n1 zsh -n && zsh -n @webAPI && zsh -n _@webAPI && zsh -n install.zsh

      - name: Run @webAPI zsh test suite
        run: zsh tests/test@webAPI.zsh
